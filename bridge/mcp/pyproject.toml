[project]
name = "ugs-mcp"
version = "0.1.0"
description = "MCP server: Claude's side of ugs-bridge (bridge/SPEC.md §5)"
requires-python = ">=3.12,<3.14"
dependencies = ["mcp>=2.3", "httpx>=0.28", "websockets>=15", "shapeoko-surface"]

[project.scripts]
ugs-mcp = "ugs_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"
